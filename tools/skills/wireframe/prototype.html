<style>
/* Prototype page: an Info tab to read, and a Prototype tab that is one device you click through in place.
   The page's own chrome uses pt- classes; the app's screens live inside .canvas and use the app's own CSS. */
:root {
  --pt-bg: oklch(0.968 0.007 249); --pt-soft: #f5f9fc; --pt-surface: #fff; --pt-fg: oklch(0.290 0.008 250); --pt-muted: oklch(0.47 0.030 249); --pt-line: oklch(0.929 0.013 249);
  --pt-accent: #0c77d8; --pt-accent-soft: #edf6fc; --pt-primary: oklch(0.565 0.195 249); --pt-on-primary: #fff;
  --pt-good: #008d1a; --pt-good-soft: #e6f4e8; --pt-warn: #9a6207; --pt-warn-soft: #fff2de; --pt-fix: #d32f2f;
  --pt-pin-change: #0c77d8; --pt-pin-change-fg: #fff; --pt-pin-question: #ffbd59; --pt-pin-question-fg: #123250; --pt-pin-idea: #008d1a; --pt-pin-idea-fg: #fff;
  --pt-lift: 0 1px 3px rgb(18 50 80 / .08);
  --pt-font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pt-bg: oklch(0.160 0.020 249); --pt-soft: #182433; --pt-surface: oklch(0.210 0.025 249); --pt-fg: oklch(0.984 0.003 249); --pt-muted: oklch(0.704 0.030 249); --pt-line: oklch(1 0 0 / 12%);
    --pt-accent: #3d94e6; --pt-accent-soft: #16283c; --pt-primary: oklch(0.650 0.200 249); --pt-on-primary: #08131f;
    --pt-good: #3fbf5a; --pt-good-soft: #14301b; --pt-warn: #ffbd59; --pt-warn-soft: #3a2c12; --pt-fix: #ef6b6b;
    --pt-pin-change: #3d94e6; --pt-pin-change-fg: #08131f; --pt-pin-question: #ffbd59; --pt-pin-question-fg: #08131f; --pt-pin-idea: #3fbf5a; --pt-pin-idea-fg: #08131f;
    --pt-lift: 0 1px 3px rgb(0 0 0 / .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --pt-bg: oklch(0.160 0.020 249); --pt-soft: #182433; --pt-surface: oklch(0.210 0.025 249); --pt-fg: oklch(0.984 0.003 249); --pt-muted: oklch(0.704 0.030 249); --pt-line: oklch(1 0 0 / 12%);
    --pt-accent: #3d94e6; --pt-accent-soft: #16283c; --pt-primary: oklch(0.650 0.200 249); --pt-on-primary: #08131f;
    --pt-good: #3fbf5a; --pt-good-soft: #14301b; --pt-warn: #ffbd59; --pt-warn-soft: #3a2c12; --pt-fix: #ef6b6b;
    --pt-pin-change: #3d94e6; --pt-pin-change-fg: #08131f; --pt-pin-question: #ffbd59; --pt-pin-question-fg: #08131f; --pt-pin-idea: #3fbf5a; --pt-pin-idea-fg: #08131f;
    --pt-lift: 0 1px 3px rgb(0 0 0 / .4); color-scheme: dark;
}
html, body { margin: 0; height: 100%; }
body { background: var(--pt-soft); color: var(--pt-fg); font: 15px/1.55 var(--pt-font); }
.pt-app { min-height: 100vh; display: flex; flex-direction: column; }
.pt-top [hidden], .pt-bar [hidden], .pt-side [hidden] { display: none !important; }
.pt-ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pt-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 44px; padding: 10px 20px; background: var(--pt-surface); box-shadow: 0 1px 0 var(--pt-line), 0 2px 10px rgb(18 50 80 / .05); }
.pt-id { font-weight: 600; font-size: 15px; min-width: 0; flex: 1 1 200px; }
.pt-id small { display: block; font-weight: 400; font-size: 12px; color: var(--pt-muted); }
.pt-seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 14px; background: var(--pt-soft); }
.pt-seg button { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--pt-muted); display: inline-flex; gap: 6px; align-items: center; }
.pt-seg button[aria-pressed="true"] { background: var(--pt-surface); color: var(--pt-fg); box-shadow: 0 1px 3px rgb(18 50 80 / .16); }
.pt-seg button:focus-visible, .pt-btn:focus-visible { outline: 2px solid var(--pt-accent); outline-offset: 1px; }
.pt-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1 1 200px; justify-content: flex-end; font-size: 12px; color: var(--pt-muted); }
.pt-btn { all: unset; cursor: pointer; box-sizing: border-box; display: inline-flex; gap: 6px; align-items: center; height: 36px; padding: 0 12px; border-radius: 12px; font-size: 13.5px; font-weight: 500; color: var(--pt-fg); background: var(--pt-soft); white-space: nowrap; }
.pt-btn:hover { background: var(--pt-accent-soft); }
.pt-btn[aria-pressed="true"] { background: var(--pt-accent-soft); color: var(--pt-accent); box-shadow: inset 0 0 0 1.5px var(--pt-accent); }
.pt-btn[aria-disabled="true"] { color: var(--pt-muted); cursor: default; }
details.menu { position: relative; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu .btn { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; font-size: 13.5px; font-weight: 500; color: var(--pt-fg); background: var(--pt-soft); white-space: nowrap; }
.menu-panel { position: absolute; right: 0; top: calc(100% + 6px); width: min(480px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: var(--pt-surface); border-radius: 16px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); padding: 10px 14px; z-index: 30; font-size: 13px; }
.menu-panel p { margin: 0 0 6px; color: var(--pt-muted); }
.menu-panel code { display: block; font: 12.5px ui-monospace, Menlo, monospace; padding: 2px 0; overflow-wrap: anywhere; }

/* Info */
#pt-info { width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 20px 72px; box-sizing: border-box; }
.pt-hero { padding: 28px; border-radius: 20px; background: var(--pt-surface); box-shadow: var(--pt-lift); }
.pt-hero .muted:last-of-type { margin-bottom: 18px; }
#pt-info[hidden], #pt-proto[hidden] { display: none; }
#pt-info h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; font-weight: 650; letter-spacing: -.012em; }
#pt-info h2 { font-size: 17px; margin: 32px 0 8px; font-weight: 650; }
#pt-info h3 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
#pt-info p { margin: 0 0 10px; }
#pt-info .lede { font-size: 17px; color: var(--pt-fg); }
#pt-info .muted { color: var(--pt-muted); }
#pt-info ul { margin: 0 0 10px; padding-left: 20px; list-style: disc; }
#pt-info ol { margin: 0 0 10px; padding-left: 20px; list-style: decimal; }
#pt-info li { margin: 4px 0; }
#pt-info a { color: var(--pt-accent); }
#pt-info table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 12px; }
#pt-info th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--pt-muted); border-bottom: 1px solid var(--pt-line); padding: 6px 12px 6px 0; }
#pt-info td { vertical-align: top; border-bottom: 1px solid var(--pt-line); padding: 8px 12px 8px 0; }
@media (max-width: 560px) {
  #pt-info table, #pt-info thead, #pt-info tbody, #pt-info tr, #pt-info td { display: block; width: 100%; }
  #pt-info thead { display: none; }
  #pt-info td { border: 0; padding: 2px 0; }
  #pt-info tr { border-bottom: 1px solid var(--pt-line); padding: 8px 0; }
}
.pt-link { all: unset; cursor: pointer; color: var(--pt-accent); font-weight: 500; }
.pt-link:hover { text-decoration: underline; }
.pt-open { all: unset; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; margin: 6px 0 2px; padding: 10px 16px; border-radius: 12px; background: var(--pt-primary); color: var(--pt-on-primary); font-weight: 600; font-size: 14px; }
.pt-screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 8px 0 4px; }
.pt-screens button { all: unset; cursor: pointer; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: var(--pt-surface); box-shadow: var(--pt-lift); font-size: 14px; }
.pt-screens button:hover { box-shadow: inset 0 0 0 1.5px var(--pt-accent); }
.pt-screens b { display: block; font-weight: 600; color: var(--pt-fg); }
.pt-screens span { font-size: 13px; color: var(--pt-muted); }
.decision { background: var(--pt-surface); border-radius: 16px; box-shadow: var(--pt-lift); padding: 14px 16px; margin: 0 0 12px; }
.decision .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 10px; }
.decision .opt { box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; border: 1px solid var(--pt-line); border-radius: 12px; font-size: 14px; }
.decision .opt.is-picked { border-color: var(--pt-accent); background: var(--pt-accent-soft); }
.decision .opt b { font-weight: 600; font-size: 15px; }
.decision .opt > span { color: var(--pt-muted); font-size: 13.5px; }
.decision .opt > .pt-rec { font-size: 12px; font-weight: 600; color: var(--pt-good); }
.pt-opt-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.pt-try { all: unset; cursor: pointer; color: var(--pt-accent); font-size: 13.5px; font-weight: 600; }
.pt-try:hover { text-decoration: underline; }
.pt-pick { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; padding: 4px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--pt-fg); background: var(--pt-soft); }
.pt-pick[aria-pressed="true"] { background: var(--pt-primary); color: var(--pt-on-primary); font-weight: 600; }
#pt-reqs { width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 16px 72px; box-sizing: border-box; }
#pt-reqs[hidden] { display: none; }
#pt-reqs h1 { font-size: 24px; margin: 0 0 6px; font-weight: 650; }
#pt-reqs h2 { font-size: 16px; margin: 24px 0 6px; font-weight: 650; }
#pt-reqs p { margin: 0 0 10px; color: var(--pt-muted); }
#pt-reqs ol, #pt-reqs ul { list-style: none; margin: 0; padding: 0; }
.req { display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--pt-line); font-size: 15px; }
.req .req-id { flex: none; width: 58px; font: 12.5px ui-monospace, Menlo, monospace; color: var(--pt-muted); }
.req .req-text { flex: 1; min-width: 0; }
.req .pt-try { flex: none; }
.q { padding: 7px 0; border-bottom: 1px solid var(--pt-line); font-size: 14.5px; }

/* Prototype */
#pt-proto { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pt-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 20px; background: var(--pt-soft); font-size: 13px; }
.pt-bar .pt-btn { background: var(--pt-surface); }
.pt-bar .pt-btn[aria-pressed="true"] { background: var(--pt-accent-soft); }
.pt-bar .pt-seg { background: var(--pt-surface); }
.pt-bar .pt-seg button[aria-pressed="true"] { background: var(--pt-soft); box-shadow: none; }
#pt-route { flex: 1 1 140px; min-width: 0; font: 12.5px ui-monospace, Menlo, monospace; color: var(--pt-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 14px 12px 18px; overflow: hidden; position: relative; }
.pt-device { position: relative; flex: none; background: #0e141b; box-shadow: 0 10px 34px rgb(10 20 35 / .28); }
:root[data-theme="dark"] .pt-device { box-shadow: 0 0 0 1px rgb(255 255 255 / .16), 0 10px 34px rgb(0 0 0 / .5); }
.pt-device[data-dev="phone"] { padding: 10px; border-radius: 46px; }
.pt-device[data-dev="phone"] .canvas { width: 390px; height: 844px; border-radius: 36px; }
.pt-device[data-dev="phone"] .pt-chrome { display: none; }
.pt-device[data-dev="laptop"] { padding: 0; border-radius: 10px; overflow: hidden; }
.pt-device[data-dev="laptop"] .canvas { width: 1366px; height: 768px; }
.pt-chrome { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; background: #e9edf2; }
.pt-chrome i { width: 10px; height: 10px; border-radius: 50%; background: #c7ced8; }
.pt-chrome span { margin-left: 10px; flex: 0 1 520px; background: #fff; border-radius: 6px; padding: 2px 10px; font: 12px ui-monospace, Menlo, monospace; color: #55606e; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.canvas { position: relative; overflow: hidden; color-scheme: light; font-size: 14px; line-height: 1.5; }
:where(.canvas) { color: #111; background: #fff; } /* no weight, so the theme's .canvas colours win and Dark reaches them */
:root.dark .canvas { color-scheme: dark; }
.canvas .screen, .canvas .overlay { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.canvas input, .canvas textarea { -webkit-user-select: text; user-select: text; }
.canvas .screen { position: absolute; inset: 0; display: none; }
.canvas [data-scroll] { position: relative; }
.canvas .screen.is-on { display: flex; flex-direction: column; }
.canvas .overlay { position: absolute; inset: 0; z-index: 40; display: none; }
.canvas .overlay.is-on { display: block; }
.canvas [data-to], .canvas [data-back], .canvas [data-close], .canvas [data-tab], .canvas [data-toggle], .canvas [data-root], .canvas [data-toast] { cursor: pointer; }
.canvas .is-on.pt-push > [data-scroll] { animation: pt-push .18s ease-out; }
.canvas .is-on.pt-pop > [data-scroll] { animation: pt-pop .18s ease-out; }
.canvas .overlay.is-on [data-sheet] { animation: pt-sheet .2s ease-out; }
@keyframes pt-push { from { transform: translateX(26px); opacity: .55; } }
@keyframes pt-pop { from { transform: translateX(-26px); opacity: .55; } }
@keyframes pt-sheet { from { transform: translateY(40px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .canvas .is-on.pt-push > [data-scroll], .canvas .is-on.pt-pop > [data-scroll], .canvas .overlay.is-on [data-sheet] { animation: none; } }
.canvas.pt-hot .is-on [data-to], .canvas.pt-hot .is-on [data-back], .canvas.pt-hot .is-on [data-close]:not([data-scrim]), .canvas.pt-hot .is-on [data-tab], .canvas.pt-hot .is-on [data-toggle], .canvas.pt-hot .is-on [data-root], .canvas.pt-hot .is-on [data-toast] { outline: 2px solid rgb(12 119 216 / .6); outline-offset: -2px; background-color: rgb(12 119 216 / .07); }
.pt-toast { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 90; max-width: 86%; padding: 9px 14px; border-radius: 10px; background: #17202c; color: #fff; font-size: 13.5px; line-height: 1.35; text-align: center; opacity: 0; pointer-events: none; transition: opacity .15s; }
.pt-toast.on { opacity: 1; }
.pt-work { flex: 1; display: flex; min-height: 0; }
.pt-work .pt-stage { flex: 1; min-width: 0; }
.pt-side { flex: none; box-sizing: border-box; width: 400px; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 8px 12px 12px; background: var(--pt-soft); }
.pt-side[hidden] { display: none; }
.pt-side-head { display: flex; align-items: center; gap: 8px; padding: 8px 4px 0; }
.pt-side-head b { font-size: 16px; font-weight: 650; flex: 1; }
.pt-side-head > span { font-size: 13px; color: var(--pt-muted); }
.pt-side .pt-seg button { padding: 4px 11px; font-size: 13px; }
.pt-side-head .pt-seg { background: var(--pt-surface); } .pt-side-head .pt-seg button[aria-pressed="true"] { background: var(--pt-soft); box-shadow: none; }
.pt-x { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--pt-muted); font-size: 18px; line-height: 1; }
.pt-x:hover { background: var(--pt-surface); }
.pt-view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.pt-view[hidden] { display: none; }
.pt-compose { padding: 14px; border-radius: 16px; background: var(--pt-surface); box-shadow: var(--pt-lift); }
.pt-where { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--pt-muted); margin-bottom: 8px; min-width: 0; }
.pt-where b { color: var(--pt-fg); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-where span { flex: none; }
.pt-kinds { display: flex; gap: 6px; margin-bottom: 8px; }
.pt-kind { all: unset; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--pt-muted); background: var(--pt-soft); }
.pt-kind .pt-ic, .pt-tag .pt-ic { width: 13px; height: 13px; }
[data-kind="change"] { --k: var(--pt-pin-change); --kf: var(--pt-pin-change-fg); --ks: var(--pt-accent-soft); --kt: var(--pt-accent); }
[data-kind="question"] { --k: var(--pt-pin-question); --kf: var(--pt-pin-question-fg); --ks: var(--pt-warn-soft); --kt: var(--pt-warn); }
[data-kind="idea"] { --k: var(--pt-pin-idea); --kf: var(--pt-pin-idea-fg); --ks: var(--pt-good-soft); --kt: var(--pt-good); }
.pt-kind[aria-pressed="true"], .pt-tag { color: var(--kt); background: var(--ks); font-weight: 600; }
.pt-kind:focus-visible, .pt-add:focus-visible, .pt-x:focus-visible { outline: 2px solid var(--pt-accent); outline-offset: 1px; }
#pt-note-text, .pt-edit-text { display: block; width: 100%; box-sizing: border-box; min-height: 92px; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--pt-soft); color: var(--pt-fg); font: 14.5px/1.5 var(--pt-font); resize: vertical; }
#pt-note-text:focus, .pt-edit-text:focus { outline: 2px solid var(--pt-accent); outline-offset: -1px; background: var(--pt-surface); }
.pt-compose-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--pt-muted); }
.pt-add { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 12px; background: var(--pt-primary); color: var(--pt-on-primary); font-size: 14px; font-weight: 600; }
.pt-hint { margin: 6px 0 0; font-size: 12.5px; color: var(--pt-muted); }
.pt-add[aria-disabled="true"] { opacity: .45; cursor: default; }
.pt-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 1px 2px 8px; }
.pt-empty { margin: 18px 8px; text-align: center; font-size: 14px; color: var(--pt-muted); }
.pt-card { box-sizing: border-box; border-radius: 16px; padding: 12px 14px; background: var(--pt-surface); box-shadow: var(--pt-lift); font-size: 14.5px; line-height: 1.5; }
.pt-card[data-jump] { cursor: pointer; }
.pt-card[data-jump]:hover, .pt-card.hot { box-shadow: inset 0 0 0 1.5px var(--k, var(--pt-accent)); }
.pt-card-top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--pt-muted); margin-bottom: 4px; }
.pt-face { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--pt-accent-soft); color: var(--pt-accent); font-size: 12px; font-weight: 650; }
.pt-who { color: var(--pt-fg); font-weight: 600; font-size: 13.5px; }
.pt-tag { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.pt-card p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.pt-card-foot { display: flex; gap: 12px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--pt-muted); }
.pt-card-foot > span:first-child { margin-right: auto; }
.pt-remove, .pt-edit { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; font-weight: 500; color: var(--pt-muted); }
.pt-remove .pt-ic, .pt-edit .pt-ic { width: 13px; height: 13px; }
.pt-edit:hover { color: var(--pt-fg); } .pt-remove:hover { color: var(--pt-fix); }
.pt-edit-kinds { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.pt-edit-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.pt-group { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--pt-fg); margin: 6px 2px -4px; }
.pt-group + .pt-hint { margin: 0 2px; }
/* Decisions */
.pt-dec { overflow-y: auto; padding: 1px 2px 8px; }
.pt-dcard { flex: none; padding: 12px 14px; border-radius: 16px; background: var(--pt-surface); box-shadow: var(--pt-lift); }
.pt-dcard.flash { animation: pt-flash 1.2s ease-out; }
@keyframes pt-flash { 0%, 40% { box-shadow: 0 0 0 3px var(--pt-accent); } 100% { box-shadow: var(--pt-lift); } }
.pt-viewas { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
.pt-viewas select { font: 500 14px var(--pt-font); color: var(--pt-fg); background: var(--pt-soft); border: 0; border-radius: 10px; padding: 6px 8px; }
.pt-dq { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.pt-dq h3 { flex: 1; margin: 0; font-size: 15px; line-height: 1.35; font-weight: 600; }
.pt-dstate { display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--pt-muted); white-space: nowrap; }

    const path = (n.path && n.path.length ? n.path : [n.screen]).filter((id) => place(id, view.dev));
    if (path.length === 1 && path[0] !== roleStart()) path.unshift(roleStart()); // so Back has somewhere to go
    hist.jump = true; view.stack = (path.length ? path : [roleStart()]).map((id) => ({ id })); scope = "here"; render(null);
  }
  async function addNote() {
    const ta = $("#pt-note-text"), text = ta.value.trim();
    if (!text) return;
    const h = here(), options = {};
    VARIANTS.forEach((d) => { options[d.dataset.key] = view.tabs[d.dataset.key]; });
    const n = { screen: h.id, name: h.name, kind, text, device: view.dev, path: view.stack.map((s) => s.id), role: view.tabs.role || null, options, rev: Number(VERSION), pin: pending || null, at: new Date().toISOString() };
    ta.value = ""; pending = null; paintPinBtn(); paintAdd();
    await store.add(n);
  }
  const paintAdd = () => $("#pt-add").setAttribute("aria-disabled", String(!$("#pt-note-text").value.trim()));
  function setSide(open, which) {
    if (which) { panel = which; savePref("panel", which); }
    if (panel === "decisions" && !$("#pt-dec-btn").hidden) { if (pinning) cancelPin(); } else panel = "notes";
    const dec = panel === "decisions";
    $("#pt-side").hidden = !open; $("#pt-note-btn").setAttribute("aria-pressed", String(open && !dec)); $("#pt-dec-btn").setAttribute("aria-pressed", String(open && dec));
    $("#pt-side-title").textContent = dec ? "Decisions" : "Notes"; $("#pt-view-dec").hidden = !dec; $("#pt-view-notes").hidden = dec; $("#pt-scope").hidden = dec; $("#pt-dec-left").hidden = !dec;
    canvas.classList.toggle("pt-nopins", !open || dec); savePref("side", open); fit();
    if (open) paintSide();
  }
  const sideOn = (which) => !$("#pt-side").hidden && panel === which;
  $("#pt-note-btn").addEventListener("click", () => { const open = !sideOn("notes"); setSide(open, "notes"); if (open) $("#pt-note-text").focus(); });
  $("#pt-dec-btn").addEventListener("click", () => setSide(!sideOn("decisions"), "decisions"));
  $("#pt-side-close").addEventListener("click", () => setSide(false));
  $$(".pt-side [data-scope]").forEach((b) => b.addEventListener("click", () => { scope = b.dataset.scope; paintSide(); }));
  $$(".pt-compose .pt-kind").forEach((b) => b.addEventListener("click", () => { kind = b.dataset.kind; paintSide(); }));
  $("#pt-note-text").addEventListener("input", paintAdd);
  $("#pt-note-text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addNote(); } });
  $("#pt-add").addEventListener("click", addNote);
  $("#pt-add").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); addNote(); } });

  // One feedback text for Copy feedback and Starbase, in the lines the Foreman reads.
  function feedbackText() {
    const lines = [];
    DECISIONS.forEach((d) => { const p = picks[d.dataset.key]; if (p?.choice) lines.push(`Pick ${p.choice} for ${d.dataset.key}` + (p.why ? ` (why: ${p.why})` : "")); });
    const word = { change: "needs change", question: "question", idea: "idea" };
    entries.slice().reverse().forEach((n) => {
      const where = [n.device, n.pin && n.pin.label && `at "${n.pin.label}"`, n.role].filter(Boolean).join(", ");
      lines.push(`s-${n.screen} (${where}): ${word[n.kind] || "note"}: ${n.text}`);
    });
    return lines.join("\n");
  }
  $("#pt-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(`Feedback on {{TITLE}}, revision ${VERSION}\n` + feedbackText()); setSaved("Copied"); } catch { setSaved("Couldn't copy here"); }
  });

  // In a frame: report what the page holds and where the reader is, and answer the parent's messages.
  function post() {
    if (!FRAMED) return;
    const packed = all.filter((n) => "pack" in n.dataset);
    const seenIds = new Set(), screens = [{ key: "overview", name: "Info", kind: "overview", status: "", choice: "" }];
    DECISIONS.forEach((d) => screens.push({ key: d.dataset.key, name: nameOf(d.dataset.key), kind: "choice", status: picks[d.dataset.key]?.choice ? "good" : "", choice: picks[d.dataset.key]?.choice || "" }));
    packed.forEach((n) => {
      if (seenIds.has(n.dataset.id)) return; seenIds.add(n.dataset.id);
      const has = entries.filter((e) => e.screen === n.dataset.id);
      screens.push({ key: "s-" + n.dataset.id, name: n.dataset.name || n.dataset.id, kind: "screen", status: has.some((e) => e.kind === "change") ? "fix" : has.length ? "ask" : "", choice: "" });
    });
    toParent({ type: "wireframes", version: VERSION, current: pageNow === "proto" ? "s-" + here().id : "overview", screens });
  }
  // Only the frame's own parent is listened to: the site by its stamped origin, anything else (Starbase, a test
  // harness) from the first message it sends, and on that origin only from then on.
  function fromParent(e) {
    if (e.source !== window.parent) return false;
    if (bridge.origin) return e.origin === bridge.origin;
    const t = (e.data || {}).type;
    if (e.origin !== SITE_ORIGIN && t !== "wireframes-state" && t !== "wireframes-goto" && t !== "wireframes-feedback" && t !== "wireframes-pdf") return false;
    bridge.origin = e.origin; return true;
  }
  // What the site holds for this person. The first one also restores their settings.
  function applyState(m) {
    const first = store.kind !== "site"; store.kind = "site";
    me = m.me?.id ?? null; bridge.admin = !!m.me?.admin; bridge.name = m.me?.name || ""; bridge.pdf = typeof m.pdf === "string" && m.pdf ? m.pdf : null;
    bridge.others = Array.isArray(m.others) ? m.others : [];
    const seen = new Map(); (Array.isArray(m.notes) ? m.notes : []).forEach((w) => { const n = fromWire(w); seen.set(pinKey(n), n); });
    remote = [...seen.values()].filter((n) => !n.deleted);
    Object.keys(picks).forEach((k) => delete picks[k]);
    Object.entries(m.choices || {}).forEach(([k, v]) => { picks[k] = typeof v === "string" ? { choice: v, why: "" } : { choice: v?.choice || "", why: v?.why || "" }; });
    $("#pt-copy").hidden = true; // the frame can't reach the clipboard, and the notes are already on the site
    if (first) {
      const held = local.splice(0); held.forEach((n) => { delete n.id; store.add(n); });
      const v = m.view || {}; Object.assign(bridge.prefs, v);
      if (v.theme) setTheme(v.theme, true);
      if (v.dev) setDev(v.dev);
      if (v.page && PAGES[v.page]) setPage(v.page);
      if (typeof v.side === "boolean") setSide(v.side, v.panel);
      if (v.place && !hist.kept) { enter(v.place); rebuild(); render(null); }
      if (!hist.kept) { usePicks(); applyTabs(); }
    }
    paintChoices(); merge(); paintPack();
  }
  if (FRAMED) window.addEventListener("message", (e) => {
    if (!fromParent(e)) return;
    const m = e.data || {};
    if (m.type === "wireframes-state") applyState(m);
    if (m.type === "wireframes-goto" && typeof m.key === "string") {
      if (m.key === "overview") setPage("info");
      else if (m.key.startsWith("s-")) openPath([m.key.slice(2)]);
      else { setPage("info"); const d = $(`.decision[data-key="${m.key}"]`); if (d) d.scrollIntoView({ block: "start" }); }
    }
    if (m.type === "wireframes-feedback") toParent({ type: "wireframes-feedback", version: VERSION, text: feedbackText() });
    if (m.type === "wireframes-pdf") { clearTimeout(pdfWait); setSaved(m.ok === false ? (m.reason || "There's no PDF for this revision") : ""); }
  });

  // The stakeholder PDF: the build prints this view with headless Chrome. Without a built PDF, the button prints it here.
  function buildPack() {
    document.documentElement.dataset.theme = "light"; document.documentElement.classList.remove("dark"); // paper is white
    const pack = $("#pt-pack"); pack.textContent = "";
    const page = (fill) => { const p = document.createElement("section"); p.className = "pt-page"; fill(p); pack.append(p); return p; };
    page((p) => {
      p.append(Object.assign(document.createElement("h1"), { textContent: $("h1", info)?.textContent || "{{TITLE}}" }));
      p.append(Object.assign(document.createElement("p"), { className: "pk-meta", textContent: `Draft, revision ${VERSION}. All names and numbers are invented.` }));
      const lede = $(".lede", info); if (lede) p.append(Object.assign(document.createElement("p"), { textContent: lede.textContent }));
      p.append(Object.assign(document.createElement("h2"), { textContent: "Decisions" }));
      DECISIONS.forEach((d) => {
        p.append(Object.assign(document.createElement("p"), { innerHTML: "" , textContent: $("h3", d).textContent }));
        const ul = document.createElement("ul");
        $$(".opt", d).forEach((o) => ul.append(Object.assign(document.createElement("li"), { textContent: `${o.dataset.label}${"rec" in o.dataset ? " (recommended)" : ""}` })));
        p.append(ul);
      });
    });
    if ($(".req", reqs)) page((p) => {
      p.append(Object.assign(document.createElement("h1"), { textContent: "Requirements" }));
      $$(".req", reqs).forEach((r) => { const row = document.createElement("div"); row.className = "pk-req"; const b = document.createElement("b"); b.textContent = r.dataset.id; const t = document.createElement("span"); t.textContent = $(".req-text", r).textContent; row.append(b, t); p.append(row); });
    });
    const shots = all.filter((n) => "pack" in n.dataset && n.classList.contains("screen") && allowed(n));
    const shot = (n, width, height, zoom) => {
      const w = document.createElement("div"); w.className = "pk-shot";
      w.append(Object.assign(document.createElement("p"), { className: "cap", textContent: `${n.dataset.name} (${n.dataset.device === "phone" ? "Phone" : "Laptop"})` }));
      const c = document.createElement("div"); c.className = "canvas"; c.style.cssText = `width:${width}px;height:${height}px;zoom:${zoom}`;
      const clone = n.cloneNode(true); clone.classList.add("is-on"); clone.classList.remove("pt-push", "pt-pop"); $$(".pt-pin", clone).forEach((x) => x.remove()); c.append(clone); w.append(c); return w;
    };
    shots.filter((n) => n.dataset.device === "laptop").forEach((n) => page((p) => p.append(shot(n, 1366, 768, 0.7))));
    const phones = shots.filter((n) => n.dataset.device === "phone");
    for (let i = 0; i < phones.length; i += 3) page((p) => { const row = document.createElement("div"); row.className = "pk-row"; phones.slice(i, i + 3).forEach((n) => row.append(shot(n, 390, 844, 0.76))); p.append(row); });
    document.body.classList.add("pt-packing");
  }
  // Download PDF, four ways. A sandboxed frame can't download, print or open a window, so in a frame the page asks
  // the parent, which can. An artifact offers the published PDF. Opened from disk: the published PDF if there is one, else the print window.
  let pdfWait;
  function paintPack() {
    const b = $("#pt-pack-btn"), site = store.kind === "site", none = (site && !bridge.pdf) || (HOSTED && !PACK_URL);
    b.title = none ? "No PDF was published with this revision" : site || HOSTED ? "Downloads the PDF for this revision" : FRAMED ? "Asks Starbase for the PDF" : PACK_URL ? "Opens the published PDF" : "Opens the print window: choose Save as PDF";
    if (none) b.setAttribute("aria-disabled", "true"); else b.removeAttribute("aria-disabled");
  }
  // An artifact's frame ignores print(), and its /_blob/ link only resolves inside the frame, so a new tab says "not found".
  // Fetch the PDF here and offer it through the downloads capability, which also asks the viewer.
  async function savePack() {
    try {
      const d = await window.claude.use("downloads");
      if (!d) return setSaved("This page can't save the PDF here");
      const r = await fetch(PACK_URL);
      if (!r.ok) throw new Error(String(r.status));
      setSaved("");
      await d.save({ filename: "{{TITLE}}.pdf", data: await r.blob() });
    } catch (e) { if (e?.code !== "declined") setSaved("Couldn't get the PDF"); }
  }
  $("#pt-pack-btn").addEventListener("click", () => {
    if (HOSTED) { if (PACK_URL) savePack(); else setSaved("There's no PDF for this revision"); return; }
    if (store.kind === "site") { if (bridge.pdf) toParent({ type: "wireframes-pdf", url: bridge.pdf }); else setSaved("There's no PDF for this revision"); return; }
    if (FRAMED) { toParent({ type: "wireframes-pdf" }); clearTimeout(pdfWait); pdfWait = setTimeout(() => setSaved("Starbase didn't send the PDF"), 2000); return; }
    if (PACK_URL) { const a = document.createElement("a"); a.href = PACK_URL; a.target = "_blank"; a.rel = "noopener"; document.body.append(a); a.click(); a.remove(); return; }
    const theme = document.documentElement.dataset.theme;
    buildPack(); setTimeout(() => { window.print(); document.body.classList.remove("pt-packing"); setTheme(theme, true); }, 300);
  });

  // Light or Dark, for the page and for the screens when the app's theme defines both.
  function setTheme(t, quiet) {
    const r = document.documentElement; r.dataset.theme = t; r.classList.toggle("dark", t === "dark");
    $$("#pt-theme [data-theme-to]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeTo === t)));
    if (!quiet) savePref("theme", t, "wf-theme");
  }
  $$("#pt-theme [data-theme-to]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeTo)));

  if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
  const menu = $("details.menu .btn"); if (menu) menu.prepend(icon("file-text"));
  setTheme(lsGet("wf-theme", window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), true);
  const kept = window.history.state?.pt;
  if (kept && !PACKING) { hist.kept = true; hist.n = kept.n || 0; hist.e = kept.e || 0; enter(kept); }
  else usePicks();
  setDev(view.dev);
  if (!kept) hist.ids = stackIds(); // the page's first entry is the one it opened on
  hist.live = !PACKING; mark();
  setPage(lsGet(LS + ":page", "info"));
  merge(); paintChoices(); paintPinBtn(); paintPack(); paintShowing();
  setSide(lsGet(LS + ":side", window.innerWidth > 1000));
  if (PACKING) buildPack();
  if (HOSTED) {
    window.claude.use("db").then(async (d) => {
      if (!d) return;
      db = d;
      try {
        const snap = await d.collection("notes").get();
        snap.docs.forEach((x) => { picks[x.id] = { ...(picks[x.id] || {}), ...x.data() }; });
        if (!hist.kept) { usePicks(); applyTabs(); }
        paintChoices();
      } catch {}
      try { userApi = await window.claude.use("user"); if (userApi) me = await userApi.id(); } catch {}
      d.collection("feedback").onSnapshot(async (snap) => {
        remote = snap.docs.map((x) => ({ ...x.data(), id: x.id }));
        const ids = [...new Set(remote.map((n) => n.author).filter((a) => a && a !== me))];
        if (userApi && ids.length) { try { const ps = await userApi.profiles(ids); ids.forEach((i) => { names[i] = (ps[i] && ps[i].name) || names[i]; }); } catch {} }
        merge();
      }, () => {});
    }).catch(() => {});
  }

  // Screens get their styles from Tailwind, compiled in the browser from a CDN script. On a hosted page that has failed
  // now and then: the page works and the screens are bare text, and nothing reports it. So check, build again, load the
  // script again, and say so in words if it still fails. Any failure leaves a row in "health" to read back.
  (function keepStyled() {
    const source = () => $('style[type="text/tailwindcss"]');
    if (!source()) return;
    const root = document.documentElement, t0 = Date.now(), tried = [];
    const token = (source().textContent.match(/:root\s*\{[^}]*?(--[\w-]+)\s*:/) || [])[1];
    const probe = document.createElement("i"); probe.className = "flex";
    probe.style.cssText = "position:absolute;visibility:hidden;width:0;height:0"; document.body.append(probe);
    const sheet = () => [...document.querySelectorAll("style:not([type])")].find((s) => s.textContent.includes("tailwindcss v"));
    const hasTheme = () => !token || getComputedStyle(root).getPropertyValue(token) !== "";
    const styled = () => getComputedStyle(probe).display === "flex" && hasTheme();
    const script = () => $('script[src*="tailwindcss"]');
    let stage = "";
    async function report(ok) {
      const e = script() && performance.getEntriesByName(script().src)[0];
      const row = { at: new Date().toISOString(), rev: Number(VERSION), ok, stage, tried, sheet: sheet()?.textContent.length || 0, ms: Date.now() - t0,
        script: e ? { status: e.responseStatus ?? null, size: e.transferSize ?? null, ms: Math.round(e.duration) } : null };
      console.warn("Prototype styles", row);
      if (HOSTED) { try { const d = await window.claude.use("db"); if (d) await d.collection("health").add(row); } catch {} }
    }
    const fixes = [
      [4000, "build again", () => { const s = source(); s.replaceWith(s.cloneNode(true)); }],
      [8000, "load script again", () => { const s = document.createElement("script"); s.src = script().src + "?retry=1"; document.head.append(s); }],
    ];
    const timer = setInterval(() => {
      const ok = styled(), late = Date.now() - t0;
      if (ok || late > 14000) {
        clearInterval(timer); probe.remove(); root.dataset.styled = ok ? "yes" : "no";
        if (!ok) setSaved("The screens didn't load their styles. Reload the page.");
        if (tried.length) report(ok);
        return;
      }
      const next = fixes[tried.length];
      if (next && late > next[0]) {
        if (!stage) stage = !sheet() ? "no build" : !hasTheme() ? "no theme" : "no classes";
        tried.push(next[1]); try { next[2](); } catch {}
      }
    }, 400);
  })();
})();
</script>
